<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Serif;src:url(NotoSerifJP_400Regular.ttf)}
@font-face{font-family:Sans;src:url(NotoSansJP_500Medium.ttf)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:800px;overflow:hidden;background:#0E1420;color:#F3EDE2;font-family:Sans;padding:64px 70px;position:relative}
.glow{position:absolute;width:1000px;height:700px;left:100px;top:120px;border-radius:50%;filter:blur(50px);background:radial-gradient(closest-side,rgba(224,123,57,.18),transparent)}
h2{font-family:Serif;font-weight:400;font-size:46px;letter-spacing:.06em;position:relative}
p.lead{color:#A8A29A;font-size:21px;margin-top:12px;position:relative}
.rows{margin-top:40px;display:flex;flex-direction:column;gap:14px;position:relative}
.row{display:grid;grid-template-columns:170px 1fr 300px;align-items:center;gap:24px;padding:20px 28px;border-radius:16px;background:rgba(28,31,38,.85);border:1px solid #2C3240}
.row .p{font-family:Serif;font-size:38px}.row .p small{font-size:20px;margin-left:4px}
.row .n{font-size:24px}.row .n small{display:block;font-size:17px;color:#A8A29A;margin-top:4px}
.row .w{font-size:17px;color:#A8A29A;text-align:right}
.row.hl{border-color:#E07B39;box-shadow:0 0 40px rgba(224,123,57,.18)}
.tag{font-size:14px;color:#1A1209;background:#F2A65A;border-radius:99px;padding:3px 10px;margin-left:10px;vertical-align:middle}
</style></head><body><div class="glow"></div>
<h2>リターン一覧</h2><p class="lead">金額が上がるほど、下のリターンもすべて含みます。</p>
<div class="rows">
<div class="row"><div class="p">1,000<small>円</small></div><div class="n">お礼の手紙<small>お礼のメール・公式サイトにお名前（希望者）</small></div><div class="w">2027年1月</div></div>
<div class="row"><div class="p">3,000<small>円</small></div><div class="n">応援メンバー1年分<small>広告なし・自分の記録の書き出し</small></div><div class="w">2027年1月（アプリ公開時）</div></div>
<div class="row"><div class="p">5,000<small>円</small></div><div class="n">＋ 1日1問ノート<small>アプリと同じ問いが30日分、紙で考える</small></div><div class="w">2027年2月</div></div>
<div class="row"><div class="p">10,000<small>円</small></div><div class="n">＋ 1年の本<small>2027年の自分の答えを1冊に</small></div><div class="w">2027年12月〜2028年1月</div></div>
<div class="row"><div class="p">30,000<small>円</small></div><div class="n">＋ あなたの問いを、みんなへ<small>考えた問いが、ある朝全員に届く（運営の確認あり）</small></div><div class="w">2027年6月までに配信</div></div>
</div></body></html>
