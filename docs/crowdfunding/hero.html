<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Serif;src:url(NotoSerifJP_400Regular.ttf)}
@font-face{font-family:Sans;src:url(NotoSansJP_500Medium.ttf)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:800px;overflow:hidden;background:#0E1420;color:#F3EDE2;font-family:Sans;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(40px)}
.g1{width:900px;height:900px;left:520px;top:-60px;background:radial-gradient(closest-side,rgba(224,123,57,.32),rgba(224,123,57,.08) 55%,transparent)}
.g2{width:520px;height:520px;left:-160px;top:420px;background:radial-gradient(closest-side,rgba(242,166,90,.12),transparent)}
.left{position:absolute;left:84px;top:0;height:800px;display:flex;flex-direction:column;justify-content:center;gap:28px;width:560px}
.tag{font-size:20px;letter-spacing:.24em;color:#F2A65A;display:flex;align-items:center;gap:14px}
.tag i{width:9px;height:9px;border-radius:50%;background:#F2A65A;box-shadow:0 0 16px 4px rgba(242,166,90,.7)}
h1{font-family:Serif;font-weight:400;font-size:112px;letter-spacing:.08em;line-height:1.1}
h1 small{display:block;font-size:26px;letter-spacing:.5em;color:#A8A29A;margin-top:14px;font-family:Sans}
.copy{font-family:Serif;font-size:36px;line-height:1.7;letter-spacing:.04em}
.sub{font-size:21px;color:#c9c2b6;line-height:1.8;letter-spacing:.06em}
.phones{position:absolute;right:70px;top:70px;width:520px;height:700px}
.phone{position:absolute;width:290px;height:628px;border-radius:44px;padding:11px;background:#1C1F26;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 2px #2C3240}
.phone img{width:100%;height:100%;border-radius:34px;object-fit:cover;object-position:top;display:block}
.p1{left:0;top:52px;transform:rotate(-4deg)}
.p2{left:210px;top:0;transform:rotate(3deg)}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="left">
  <div class="tag"><i></i>1日ひとつの問いと、10通の手紙</div>
  <h1>おいと間<small>おいとま</small></h1>
  <div class="copy">情報と情報のあいだに、<br>ひと呼吸の「間」を。</div>
  <div class="sub">スマホを置いて考えてから答える。<br>数字もスクロールもない、静かな場所。</div>
</div>
<div class="phones">
  <div class="phone p1"><img src="03-home.png"></div>
  <div class="phone p2"><img src="07-letters.png"></div>
</div>
</body></html>
